<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Untuk Kamu 🤍</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    #app {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .page {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .page.active {
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .emoji-big { font-size: 52px; }

    h1 {
      font-size: 22px;
      color: #333;
    }

    p.sub {
      font-size: 15px;
      color: #666;
    }

    .btn-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 36px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
    }

    .btn-yes {
      background: #D4537E;
      border-color: #D4537E;
      color: #fff;
    }

    .btn-no {
      background: transparent;
      border-color: #ccc;
      color: #888;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 177.78%;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

  </style>

</head>

<body>
  <div id="app">

```
<div class="page active" id="page-1">
  <h1>Maafin aku ya? 🥺</h1>
  <div class="btn-row">
    <button class="btn btn-yes" onclick="go('page-2')">Ya 💕</button>
    <button class="btn btn-no" onclick="alert('yah 😔')">Tidak</button>
  </div>
</div>

<div class="page" id="page-2">
  <h1>Beneran? 😳</h1>
  <div class="btn-row">
    <button class="btn btn-yes" onclick="go('page-final')">Iya 🤍</button>
  </div>
</div>

<div class="page" id="page-final">
  <h1>Makasih 😭💗</h1>

  <div class="video-wrap">
    <iframe id="myVideo"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <p class="fallback">
    Kalau video nggak jalan, klik 
    <a href="https://drive.google.com/file/d/180vZPk_RkqRb0DWAqJ5Cn8Mi2JHF7mMJ/view" target="_blank">
      di sini
    </a>
  </p>

</div>
```

  </div>

  <script>
    function go(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      if (pageId === 'page-final') {
        loadVideo();
      }
    }

    function loadVideo() {
      const iframe = document.getElementById("myVideo");
      const url = "https://drive.google.com/file/d/180vZPk_RkqRb0DWAqJ5Cn8Mi2JHF7mMJ/preview?autoplay=1&mute=1";

      iframe.src = url;

      // retry hack (biar lebih maksa autoplay)
      setTimeout(() => {
        iframe.src = url;
      }, 1000);
    }
  </script>

</body>
</html>
